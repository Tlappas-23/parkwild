# Runs on every push and pull request. Offline only: no tokens, no network.
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && pip install -e .
      - name: secret scan over the whole tree
        run: python scripts/check_secrets.py --tree
      - name: lint
        run: ruff check src tests scripts
      - name: provenance coverage (every constant tagged)
        run: python scripts/provenance_report.py --strict
      - name: unit tests
        run: python -m pytest -q
      - name: smoke test (fixtures only, must finish under 5 minutes)
        run: timeout 300 python scripts/smoke.py
