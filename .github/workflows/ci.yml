# Runs on every push and pull request. Offline only: no tokens, no network.
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && pip install -e .
      - name: secret scan over the whole tree
        run: python scripts/check_secrets.py --tree
      - name: lint
        run: ruff check src tests scripts
      - name: provenance coverage (every constant tagged)
        run: python scripts/provenance_report.py --strict
      - name: unit tests
        run: python -m pytest -q
      - name: smoke test (fixtures only, must finish under 5 minutes)
        run: timeout 300 python scripts/smoke.py
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit -p .
      - name: lint
        run: npm run lint
      - name: formatting
        run: npm run format:check
      - name: unit tests
        run: npm test
      - name: build
        run: npm run build
