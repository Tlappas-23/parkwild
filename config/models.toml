# 3D model per species. `file` is the raw GLB as downloaded into
# app/public/models/raw/ (name it as the site saved it, or rename to match).
# scripts/models_ingest.py hashes the raw file, Draco-compresses it to
# app/public/models/<key>.glb, checks the 2 MB budget, and writes
# app/public/models/index.json, which the export copies into species.json.
# Licence lines are quoted from the model pages as read on 2026-09-05.

[bison_bison]
species = "Bison bison"
file    = "Bizon.glb"
title   = "Bizon"
author  = "madtrollstudio"
source  = "https://poly.pizza/m/RqkLNYPnfx"
license = "CC BY 3.0"
license_line = "Mar 12, 2024 • FBX/GLTF format • Creative Commons Attribution"
credit  = "Bizon by madtrollstudio, CC BY 3.0, via Poly Pizza"

